<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillCraft Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:         #0E1117;
    --surface:    #161B27;
    --surface2:   #1E2535;
    --border:     #2A3347;
    --cyan:       #00D4FF;
    --cyan-dim:   #0099BB;
    --purple:     #7C3AED;
    --soft-white: #E8EDF5;
    --muted:      #6B7A99;
    --num-bg:     #1A2236;
    --num-hover:  #222D44;
    --num-active: #2A3855;
    --op-bg:      #1B2040;
    --op-hover:   #242B55;
    --op-active:  #2C3568;
    --eq-bg:      #00D4FF;
    --eq-hover:   #00BBDD;
    --eq-active:  #0099BB;
    --fn-bg:      #1A1F35;
    --fn-hover:   #222840;
    --fn-active:  #2A3050;
    --error:      #FF6B6B;
    --radius:     14px;
    --btn-radius: 12px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ─── WRAPPER ─── */
  .calc-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 24px 0;
  }

  .calc-brand {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .calc-brand span { color: var(--cyan); }

  /* ─── CALCULATOR BODY ─── */
  .calculator {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    width: 340px;
    box-shadow:
      0 0 0 1px rgba(0,212,255,0.04),
      0 24px 64px rgba(0,0,0,0.6);
  }

  /* ─── DISPLAY ─── */
  .display {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px 14px;
    margin-bottom: 16px;
    min-height: 96px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    position: relative;
  }

  .display-expr {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--muted);
    min-height: 1.4em;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 4px;
    transition: color 0.2s;
  }

  .display-main {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2.4rem;
    font-weight: 500;
    color: var(--soft-white);
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.1;
    transition: color 0.15s, font-size 0.15s;
  }

  .display-main.error {
    color: var(--error);
    font-size: 1.3rem;
  }

  .display-main.result {
    color: var(--cyan);
  }

  /* keyboard hint */
  .kbd-hint {
    position: absolute;
    top: 10px; left: 12px;
    font-size: 0.65rem;
    color: var(--border);
    letter-spacing: 0.06em;
    transition: color 0.3s;
  }

  .calculator:focus-within .kbd-hint,
  .kbd-hint.active { color: var(--muted); }

  /* ─── BUTTON GRID ─── */
  .btn-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  /* base button */
  .btn {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.05rem;
    font-weight: 500;
    border: none;
    border-radius: var(--btn-radius);
    cursor: pointer;
    padding: 0;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s ease, transform 0.08s ease, box-shadow 0.12s ease;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    overflow: hidden;
  }

  .btn:focus-visible {
    box-shadow: 0 0 0 2px var(--cyan);
  }

  /* ripple */
  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.06);
    opacity: 0;
    border-radius: inherit;
    transition: opacity 0.15s;
  }

  .btn:active::after { opacity: 1; }
  .btn:active { transform: scale(0.95); }

  /* number buttons */
  .btn-num {
    background: var(--num-bg);
    color: var(--soft-white);
    border: 1px solid var(--border);
  }
  .btn-num:hover { background: var(--num-hover); }
  .btn-num:active { background: var(--num-active); }

  /* zero spans 2 cols */
  .btn-zero {
    grid-column: span 2;
    justify-content: flex-start;
    padding-left: 24px;
  }

  /* operator buttons */
  .btn-op {
    background: var(--op-bg);
    color: var(--cyan);
    border: 1px solid rgba(0,212,255,0.15);
    font-size: 1.25rem;
  }
  .btn-op:hover { background: var(--op-hover); }
  .btn-op:active { background: var(--op-active); }
  .btn-op.active-op {
    background: rgba(0,212,255,0.12);
    border-color: rgba(0,212,255,0.4);
    color: var(--cyan);
  }

  /* function buttons (AC, +/-, %) */
  .btn-fn {
    background: var(--fn-bg);
    color: var(--muted);
    border: 1px solid var(--border);
    font-size: 0.95rem;
  }
  .btn-fn:hover { background: var(--fn-hover); color: var(--soft-white); }
  .btn-fn:active { background: var(--fn-active); }

  /* AC button – accent on error/non-zero */
  .btn-fn.btn-ac { color: var(--soft-white); }

  /* equals */
  .btn-eq {
    background: var(--eq-bg);
    color: #0A0F1E;
    font-weight: 700;
    font-size: 1.3rem;
    border: none;
    box-shadow: 0 4px 20px rgba(0,212,255,0.25);
  }
  .btn-eq:hover { background: var(--eq-hover); }
  .btn-eq:active { background: var(--eq-active); transform: scale(0.95); }

  /* ─── HISTORY PANEL ─── */
  .history-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 14px;
    padding: 0 2px;
    cursor: pointer;
    transition: color 0.2s;
  }
  .history-toggle:hover { color: var(--soft-white); }
  .history-toggle-icon { font-size: 0.9rem; transition: transform 0.25s; }
  .history-toggle-icon.open { transform: rotate(180deg); }

  .history-panel {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .history-panel.open { max-height: 200px; }

  .history-list {
    list-style: none;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    max-height: 180px;
    padding-right: 2px;
  }

  .history-list::-webkit-scrollbar { width: 3px; }
  .history-list::-webkit-scrollbar-track { background: transparent; }
  .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .history-item:hover {
    border-color: rgba(0,212,255,0.25);
    background: rgba(0,212,255,0.04);
  }

  .history-expr {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .history-result {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    color: var(--cyan);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .history-empty {
    font-size: 0.75rem;
    color: var(--border);
    text-align: center;
    padding: 12px 0;
    font-style: italic;
  }

  /* ─── KEYBOARD OVERLAY ─── */
  .kb-strip {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 340px;
  }

  .kb-key {
    font-size: 0.65rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 7px;
  }

  .kb-key span { color: var(--soft-white); }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 400px) {
    .calculator { width: calc(100vw - 32px); }
    .btn { height: 54px; font-size: 1rem; }
    .display-main { font-size: 2rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>

<div class="calc-wrapper">
  <div class="calc-brand"><span>Skill</span>Craft Calculator</div>

  <div class="calculator" id="calculator">

    <!-- Display -->
    <div class="display">
      <div class="kbd-hint" id="kbdHint">⌨ keyboard ready</div>
      <div class="display-expr" id="displayExpr">&nbsp;</div>
      <div class="display-main" id="displayMain">0</div>
    </div>

    <!-- Button Grid -->
    <div class="btn-grid" id="btnGrid">
      <!-- Row 1: functions + divide -->
      <button class="btn btn-fn btn-ac" data-action="clear"    id="btnAC">AC</button>
      <button class="btn btn-fn"        data-action="sign"               >+/−</button>
      <button class="btn btn-fn"        data-action="percent"            >%</button>
      <button class="btn btn-op"        data-action="operator" data-op="÷">÷</button>

      <!-- Row 2: 7 8 9 × -->
      <button class="btn btn-num" data-action="digit" data-val="7">7</button>
      <button class="btn btn-num" data-action="digit" data-val="8">8</button>
      <button class="btn btn-num" data-action="digit" data-val="9">9</button>
      <button class="btn btn-op"  data-action="operator" data-op="×">×</button>

      <!-- Row 3: 4 5 6 − -->
      <button class="btn btn-num" data-action="digit" data-val="4">4</button>
      <button class="btn btn-num" data-action="digit" data-val="5">5</button>
      <button class="btn btn-num" data-action="digit" data-val="6">6</button>
      <button class="btn btn-op"  data-action="operator" data-op="−">−</button>

      <!-- Row 4: 1 2 3 + -->
      <button class="btn btn-num" data-action="digit" data-val="1">1</button>
      <button class="btn btn-num" data-action="digit" data-val="2">2</button>
      <button class="btn btn-num" data-action="digit" data-val="3">3</button>
      <button class="btn btn-op"  data-action="operator" data-op="+">+</button>

      <!-- Row 5: 0 . = -->
      <button class="btn btn-num btn-zero" data-action="digit" data-val="0">0</button>
      <button class="btn btn-num"          data-action="decimal"          >.</button>
      <button class="btn btn-eq"           data-action="equals"           >=</button>
    </div>

    <!-- History panel -->
    <div class="history-toggle" id="historyToggle" role="button" tabindex="0" aria-expanded="false">
      <span>History</span>
      <span class="history-toggle-icon" id="historyIcon">▾</span>
    </div>
    <div class="history-panel" id="historyPanel" aria-live="polite">
      <ul class="history-list" id="historyList">
        <li class="history-empty" id="historyEmpty">No calculations yet</li>
      </ul>
    </div>
  </div>

  <!-- Keyboard reference -->
  <div class="kb-strip" aria-label="Keyboard shortcuts">
    <div class="kb-key"><span>0–9</span> digits</div>
    <div class="kb-key"><span>+ − * /</span> ops</div>
    <div class="kb-key"><span>Enter</span> equals</div>
    <div class="kb-key"><span>Esc</span> clear</div>
    <div class="kb-key"><span>Backspace</span> delete</div>
    <div class="kb-key"><span>.</span> decimal</div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════
   SKILLCRAFT CALCULATOR — Core Logic
   ════════════════════════════════════════════════ */

// ── State ──────────────────────────────────────
const state = {
  current:      '0',      // what's on the display
  previous:     null,     // left-hand operand (string)
  operator:     null,     // pending operator symbol
  justEvaled:   false,    // did we just press =?
  hasDecimal:   false,    // guard against double decimals
  hasError:     false,
  history:      [],
};

// ── DOM refs ───────────────────────────────────
const displayMain = document.getElementById('displayMain');
const displayExpr = document.getElementById('displayExpr');
const btnAC       = document.getElementById('btnAC');
const btnGrid     = document.getElementById('btnGrid');
const historyList = document.getElementById('historyList');
const historyEmpty= document.getElementById('historyEmpty');
const historyPanel= document.getElementById('historyPanel');
const historyIcon = document.getElementById('historyIcon');
const historyToggle = document.getElementById('historyToggle');
const kbdHint     = document.getElementById('kbdHint');

// ── Render ──────────────────────────────────────
function render() {
  // Format number for display — avoid floating-point artifacts
  const formatted = formatDisplay(state.current);
  displayMain.textContent = formatted;

  // Shrink text for long numbers
  const len = formatted.replace('.','').replace('-','').length;
  if (len > 12)      displayMain.style.fontSize = '1.2rem';
  else if (len > 9)  displayMain.style.fontSize = '1.6rem';
  else if (len > 7)  displayMain.style.fontSize = '2rem';
  else               displayMain.style.fontSize = '2.4rem';

  // Color
  displayMain.classList.toggle('error',  state.hasError);
  displayMain.classList.toggle('result', state.justEvaled && !state.hasError);

  // Expression line
  if (state.operator && state.previous !== null) {
    displayExpr.textContent = `${formatDisplay(state.previous)} ${state.operator}`;
  } else {
    displayExpr.innerHTML = '&nbsp;';
  }

  // AC vs C
  btnAC.textContent = (state.current !== '0' || state.previous !== null) ? 'C' : 'AC';

  // Highlight active operator button
  document.querySelectorAll('.btn-op').forEach(b => {
    b.classList.toggle('active-op',
      b.dataset.op === state.operator && !state.justEvaled
    );
  });
}

function formatDisplay(val) {
  if (val === null || val === undefined) return '0';
  const str = String(val);
  if (str === 'Infinity' || str === '-Infinity') return 'Cannot divide by 0';
  if (str === 'NaN') return 'Error';
  // If it's a valid number, format with commas (but keep decimal portion intact)
  const num = parseFloat(str);
  if (isNaN(num)) return str;
  // Split on decimal
  const [intPart, decPart] = str.split('.');
  const formattedInt = parseInt(intPart, 10).toLocaleString('en-US');
  return decPart !== undefined ? `${formattedInt}.${decPart}` : formattedInt;
}

// ── Arithmetic ──────────────────────────────────
function calculate(a, op, b) {
  const A = parseFloat(a);
  const B = parseFloat(b);
  if (isNaN(A) || isNaN(B)) return 'Error';
  switch (op) {
    case '+': return A + B;
    case '−': return A - B;
    case '×': return A * B;
    case '÷':
      if (B === 0) return Infinity;
      return A / B;
    default: return B;
  }
}

// Trim floating-point noise (e.g. 0.1+0.2 = 0.30000000000000004)
function cleanResult(n) {
  if (!isFinite(n)) return n;
  // Round to 12 significant figures to kill noise
  return parseFloat(n.toPrecision(12));
}

// ── Actions ─────────────────────────────────────
function inputDigit(digit) {
  if (state.hasError) return;

  if (state.justEvaled) {
    // Start fresh after a result
    state.current    = digit === '0' ? '0' : digit;
    state.previous   = null;
    state.operator   = null;
    state.justEvaled = false;
    state.hasDecimal = false;
    render(); return;
  }

  if (state.current === '0' && digit !== '0') {
    state.current = digit;
  } else if (state.current === '0' && digit === '0') {
    // keep as 0
  } else if (state.current === '-0') {
    state.current = '-' + digit;
  } else {
    if (state.current.replace('-','').replace('.','').length >= 15) return; // max digits
    state.current += digit;
  }
  render();
}

function inputDecimal() {
  if (state.hasError) return;
  if (state.justEvaled) {
    state.current    = '0.';
    state.previous   = null;
    state.operator   = null;
    state.justEvaled = false;
    state.hasDecimal = true;
    render(); return;
  }
  if (state.hasDecimal) return;
  state.hasDecimal = true;
  state.current += '.';
  render();
}

function inputOperator(op) {
  if (state.hasError) return;
  state.justEvaled = false;

  // Chain: if we already have a pending op + previous, evaluate first
  if (state.operator && state.previous !== null) {
    const result = cleanResult(calculate(state.previous, state.operator, state.current));
    if (!isFinite(result) || isNaN(result)) {
      showError(isNaN(result) ? 'Error' : 'Cannot divide by 0');
      return;
    }
    state.previous = String(result);
    state.current  = String(result);
  } else {
    state.previous = state.current;
  }

  state.operator   = op;
  state.hasDecimal = false;
  // Next digit input will replace current
  state._waitingForOperand = true;
  render();

  // Flag so next digit replaces current
  state._nextDigitReplaces = true;
}

// Override inputDigit to respect replacement flag
const _origInputDigit = inputDigit;
function inputDigitSmart(digit) {
  if (state._nextDigitReplaces && !state.justEvaled) {
    state.current            = digit === '0' ? '0' : digit;
    state.hasDecimal         = false;
    state._nextDigitReplaces = false;
    render(); return;
  }
  _origInputDigit(digit);
}

function inputEquals() {
  if (state.hasError) return;
  if (state.operator === null || state.previous === null) {
    state.justEvaled = true;
    render(); return;
  }

  const expr    = `${formatDisplay(state.previous)} ${state.operator} ${formatDisplay(state.current)}`;
  const rawResult = calculate(state.previous, state.operator, state.current);

  if (!isFinite(rawResult) || isNaN(rawResult)) {
    pushHistory(expr, isNaN(rawResult) ? 'Error' : '÷0');
    showError(isNaN(rawResult) ? 'Error' : 'Cannot divide by 0');
    return;
  }

  const result = cleanResult(rawResult);
  const resultStr = String(result);

  pushHistory(expr, formatDisplay(resultStr));

  state.current            = resultStr;
  state.previous           = null;
  state.operator           = null;
  state.justEvaled         = true;
  state.hasDecimal         = resultStr.includes('.');
  state._nextDigitReplaces = false;
  render();
}

function inputClear() {
  if (state.current !== '0' && !state.justEvaled && state.previous === null) {
    // "C" — clear current entry only
    state.current    = '0';
    state.hasDecimal = false;
  } else {
    // "AC" — reset everything
    state.current            = '0';
    state.previous           = null;
    state.operator           = null;
    state.justEvaled         = false;
    state.hasDecimal         = false;
    state.hasError           = false;
    state._nextDigitReplaces = false;
  }
  render();
}

function inputBackspace() {
  if (state.hasError)    { inputClear(); return; }
  if (state.justEvaled)  { inputClear(); return; }
  if (state.current.length <= 1 || state.current === '-0') {
    state.current    = '0';
    state.hasDecimal = false;
  } else {
    if (state.current.slice(-1) === '.') state.hasDecimal = false;
    state.current = state.current.slice(0, -1);
  }
  render();
}

function inputSign() {
  if (state.hasError) return;
  if (state.current === '0') return;
  state.current = state.current.startsWith('-')
    ? state.current.slice(1)
    : '-' + state.current;
  render();
}

function inputPercent() {
  if (state.hasError) return;
  const val = parseFloat(state.current);
  if (isNaN(val)) return;
  const result = cleanResult(val / 100);
  state.current    = String(result);
  state.hasDecimal = state.current.includes('.');
  render();
}

function showError(msg) {
  state.current    = msg;
  state.previous   = null;
  state.operator   = null;
  state.justEvaled = false;
  state.hasError   = true;
  render();
}

// ── History ─────────────────────────────────────
function pushHistory(expr, result) {
  state.history.unshift({ expr, result });
  if (state.history.length > 20) state.history.pop();
  renderHistory();
}

function renderHistory() {
  historyEmpty.style.display = state.history.length ? 'none' : 'block';
  // Remove old items (keep empty message in DOM)
  [...historyList.querySelectorAll('.history-item')].forEach(el => el.remove());

  state.history.forEach(({ expr, result }) => {
    const li = document.createElement('li');
    li.className = 'history-item';
    li.innerHTML = `
      <span class="history-expr">${escHtml(expr)}</span>
      <span class="history-result">${escHtml(result)}</span>
    `;
    li.addEventListener('click', () => {
      // Restore result to current display
      const num = result.replace(/,/g, '');
      if (!isNaN(parseFloat(num))) {
        state.current    = String(parseFloat(num));
        state.previous   = null;
        state.operator   = null;
        state.justEvaled = true;
        state.hasError   = false;
        state.hasDecimal = state.current.includes('.');
        state._nextDigitReplaces = false;
        render();
      }
    });
    historyList.appendChild(li);
  });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Event Listeners ──────────────────────────────

// Button grid — single delegated listener
btnGrid.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;

  const action = btn.dataset.action;

  switch (action) {
    case 'digit':    inputDigitSmart(btn.dataset.val); break;
    case 'decimal':  inputDecimal();                    break;
    case 'operator': inputOperator(btn.dataset.op);    break;
    case 'equals':   inputEquals();                    break;
    case 'clear':    inputClear();                     break;
    case 'sign':     inputSign();                      break;
    case 'percent':  inputPercent();                   break;
  }
});

// Keyboard input
document.addEventListener('keydown', e => {
  // Show keyboard hint
  kbdHint.classList.add('active');

  if (e.key >= '0' && e.key <= '9') {
    e.preventDefault();
    inputDigitSmart(e.key);
    flashBtn(`[data-val="${e.key}"]`);
  } else if (e.key === '.') {
    e.preventDefault();
    inputDecimal();
    flashBtn('[data-action="decimal"]');
  } else if (e.key === '+') {
    e.preventDefault();
    inputOperator('+');
    flashBtn('[data-op="+"]');
  } else if (e.key === '-') {
    e.preventDefault();
    inputOperator('−');
    flashBtn('[data-op="−"]');
  } else if (e.key === '*') {
    e.preventDefault();
    inputOperator('×');
    flashBtn('[data-op="×"]');
  } else if (e.key === '/') {
    e.preventDefault();
    inputOperator('÷');
    flashBtn('[data-op="÷"]');
  } else if (e.key === 'Enter' || e.key === '=') {
    e.preventDefault();
    inputEquals();
    flashBtn('[data-action="equals"]');
  } else if (e.key === 'Escape') {
    e.preventDefault();
    inputClear();
    flashBtn('[data-action="clear"]');
  } else if (e.key === 'Backspace') {
    e.preventDefault();
    inputBackspace();
  } else if (e.key === '%') {
    e.preventDefault();
    inputPercent();
    flashBtn('[data-action="percent"]');
  }
});

// Flash a button (visual feedback for keyboard press)
function flashBtn(selector) {
  const btn = btnGrid.querySelector(selector);
  if (!btn) return;
  btn.classList.add('active-op');
  setTimeout(() => btn.classList.remove('active-op'), 140);
}

// History toggle
historyToggle.addEventListener('click', toggleHistory);
historyToggle.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleHistory(); }
});

function toggleHistory() {
  const open = historyPanel.classList.toggle('open');
  historyIcon.classList.toggle('open', open);
  historyToggle.setAttribute('aria-expanded', open);
}

// ── Init ────────────────────────────────────────
render();
renderHistory();
</script>
</body>
</html>
